name: Workflows needs

on: workflow_dispatch

jobs:
    job_first:
        runs-on: ubuntu-latest
        steps:
            - name: "First Job"
              run: echo "First job is running !"
    
    second-job:
        runs-on: ubuntu-latest
        needs: [job_first]
        steps:
            - name: "Second Job"
              run: echo "Second job is running !"